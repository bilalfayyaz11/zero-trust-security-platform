server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name localhost;

    access_log /var/log/nginx/sdp-controller-access.log;
    error_log /var/log/nginx/sdp-controller-error.log;

    location /broker/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SDP-Component "controller-to-broker";
    }

    location / {
        auth_basic "SDP Controller Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SDP-Component "controller-to-backend";
    }
}
